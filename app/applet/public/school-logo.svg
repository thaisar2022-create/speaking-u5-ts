<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6a1a84" />
      <stop offset="55%" stop-color="#4d1060" />
      <stop offset="100%" stop-color="#340643" />
    </radialGradient>

    <!-- Flower Petal Radial Gradient -->
    <radialGradient id="petalCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="35%" stop-color="#ffd54f" />
      <stop offset="70%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f0328" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" />

  <!-- Background Thai Watermark Glyphs -->
  <g fill="#611879" opacity="0.35" font-family="'Noto Sans Thai', 'Cordia New', sans-serif" font-size="28" font-weight="bold">
    <text x="60" y="80">ก</text><text x="120" y="60">ข</text><text x="210" y="70">ค</text><text x="320" y="65">ง</text><text x="410" y="90">จ</text>
    <text x="450" y="150">ฉ</text><text x="430" y="230">ช</text><text x="455" y="320">ซ</text><text x="420" y="400">ญ</text><text x="360" y="460">ด</text>
    <text x="260" y="475">ต</text><text x="160" y="460">ถ</text><text x="90" y="420">ท</text><text x="45" y="340">น</text><text x="40" y="240">บ</text>
    <text x="50" y="160">ป</text><text x="150" y="130">ผ</text><text x="260" y="125">พ</text><text x="360" y="140">မ</text><text x="410" y="200">ย</text>
    <text x="370" y="270">ร</text><text x="340" y="340">ล</text><text x="380" y="370">ဝ</text><text x="240" y="380">ส</text><text x="130" y="370">ห</text>
    <text x="90" y="290">อ</text><text x="150" y="250">ฮ</text><text x="210" y="230">ฤ</text><text x="300" y="210">ฦ</text>
  </g>

  <!-- Central Stylized Yellow Wordmark -->
  <g filter="url(#subtleDrop)">
    <!-- First Character with loop and descending hook -->
    <path d="M 85 270 
             C 75 240, 85 210, 115 210 
             C 140 210, 150 230, 155 250 
             C 165 230, 185 210, 205 210 
             C 230 210, 235 240, 220 265 
             C 205 290, 180 295, 160 290 
             C 155 310, 155 340, 152 360
             C 148 370, 140 375, 135 370
             C 130 365, 142 355, 142 340
             C 142 315, 140 295, 125 295
             C 95 295, 88 285, 85 270 Z" 
          fill="#ffea00" stroke="#ffd000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Center Loop cutout for first letter -->
    <ellipse cx="115" cy="245" rx="14" ry="16" fill="#4d1060"/>
    <ellipse cx="185" cy="250" rx="12" ry="15" fill="#4d1060"/>

    <!-- Descender hook decoration at bottom -->
    <path d="M 148 350 C 158 362, 172 365, 178 362 C 182 358, 176 352, 168 350 Z" fill="#ffea00"/>

    <!-- Tall curving flame ascender over the middle -->
    <path d="M 235 285 
             C 240 250, 230 220, 255 195 
             C 265 185, 275 160, 270 140 
             C 265 165, 250 185, 245 200 
             C 235 220, 225 245, 235 285 Z" 
          fill="#ffea00"/>

    <!-- Middle loop character -->
    <path d="M 230 270 
             C 225 235, 245 210, 275 210 
             C 295 210, 310 230, 305 255 
             C 300 285, 275 295, 250 295 
             C 235 295, 232 285, 230 270 Z" 
          fill="#ffea00" stroke="#ffd000" stroke-width="3"/>
    <ellipse cx="270" cy="252" rx="15" ry="16" fill="#4d1060"/>

    <!-- Small double middle flourish -->
    <path d="M 315 250 
             C 315 230, 330 220, 345 230 
             C 355 240, 350 260, 340 265 
             C 330 270, 315 265, 315 250 Z" 
          fill="#ffea00"/>
    <path d="M 345 250 
             C 345 230, 360 220, 375 230 
             C 385 240, 380 260, 370 265 
             C 360 270, 345 265, 345 250 Z" 
          fill="#ffea00"/>

    <!-- Right Character (round circular glyph with sweeping tail) -->
    <path d="M 390 255 
             C 390 220, 420 210, 445 215 
             C 470 220, 480 245, 475 270 
             C 470 295, 445 305, 420 300 
             C 395 295, 390 275, 390 255 Z" 
          fill="#ffea00" stroke="#ffd000" stroke-width="4"/>
    <ellipse cx="435" cy="255" rx="18" ry="19" fill="#4d1060"/>

    <!-- Tail flourish on the right -->
    <path d="M 465 240 C 475 220, 485 240, 480 255 C 475 265, 465 255, 465 240 Z" fill="#ffea00"/>
  </g>

  <!-- 5-Petal White Frangipani / Plumeria Flower with Yellow Center (top-left) -->
  <g transform="translate(135, 175) rotate(-15)" filter="url(#subtleDrop)">
    <!-- Petal 1 (Top) -->
    <path d="M 0 0 C -20 -40, -10 -75, 12 -70 C 35 -65, 30 -30, 0 0 Z" fill="#ffffff" stroke="#f0e6d2" stroke-width="0.5"/>
    <!-- Petal 2 (Top Right) -->
    <path d="M 0 0 C 25 -35, 60 -35, 65 -10 C 70 15, 35 25, 0 0 Z" fill="#ffffff" stroke="#f0e6d2" stroke-width="0.5"/>
    <!-- Petal 3 (Bottom Right) -->
    <path d="M 0 0 C 35 15, 55 45, 35 65 C 15 80, -10 50, 0 0 Z" fill="#ffffff" stroke="#f0e6d2" stroke-width="0.5"/>
    <!-- Petal 4 (Bottom Left) -->
    <path d="M 0 0 C -15 35, -45 55, -65 35 C -80 15, -45 -10, 0 0 Z" fill="#ffffff" stroke="#f0e6d2" stroke-width="0.5"/>
    <!-- Petal 5 (Top Left) -->
    <path d="M 0 0 C -45 -10, -65 -45, -40 -65 C -20 -80, 5 -45, 0 0 Z" fill="#ffffff" stroke="#f0e6d2" stroke-width="0.5"/>
    
    <!-- Flower Yellow Radiant Center -->
    <circle cx="0" cy="0" r="22" fill="url(#petalCenter)" opacity="0.95"/>
    <!-- Flower Pinwheel Swirl -->
    <path d="M 0 0 L 8 -12 M 0 0 L 14 3 M 0 0 L 3 14 M 0 0 L -12 7 M 0 0 L -8 -11" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
